name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (examples, exercises, quizzes)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    env:
      COURSE_LLM_PROVIDER: mock
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
      - name: Install ffmpeg (M2 frame grab, M8 chunk transcode, M9 media-probe contract)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check ../examples/python ../exercises ../scripts src && uv run ruff format --check ../examples/python ../exercises ../scripts src
      - name: Type-check
        run: bash ../scripts/typecheck_python.sh
      - name: Worked examples (mock models)
        run: uv run pytest -q -rs ../examples/python
      - name: Exercises (solutions pass, starters fail)
        run: uv run python ../scripts/check_exercises.py --lang py
      - name: Quizzes (schema + answer keys)
        run: uv run python ../scripts/validate_quizzes.py

  typescript:
    name: TypeScript (examples, exercises)
    runs-on: ubuntu-latest
    env:
      COURSE_LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Exercises (solutions pass, starters fail)
        run: python3 scripts/check_exercises.py --lang ts

  kmp:
    name: Kotlin Multiplatform (JVM target)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test commonMain on the JVM (fakes only; no Android SDK, no device)
        run: ./gradlew :shared:jvmTest --console=plain
      - name: Test report
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          total = fails = 0
          for f in glob.glob("shared/build/test-results/jvmTest/*.xml"):
              head = open(f).read(600)
              t = int(re.search(r'tests="(\d+)"', head).group(1)); x = int(re.search(r'failures="(\d+)"', head).group(1)) + int(re.search(r'errors="(\d+)"', head).group(1))
              total += t; fails += x
              print(f, "tests", t, "failed", x)
          print(f"KMP jvmTest: {total} tests, {fails} failed")
          PY

  rust:
    name: Rust (rmcp media-probe) + cross-language MCP contract
    runs-on: ubuntu-latest
    env:
      COURSE_LLM_PROVIDER: mock
      MEDIA_PROBE_RUST_BIN: ${{ github.workspace }}/rust/media-probe/target/debug/media-probe
      MEDIA_PROBE_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: fmt, clippy, test
        working-directory: rust/media-probe
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --locked
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Python client vs Python, TypeScript and Rust servers (both revisions, real ffmpeg)
        working-directory: python
        run: uv sync --locked && uv run pytest -q -rs ../examples/python/m9
      - name: TypeScript client vs Rust server
        run: pnpm vitest run examples/ts/m9

  site:
    name: Site build + internal link validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
