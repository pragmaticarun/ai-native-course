name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (examples, exercises, quizzes)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    env:
      COURSE_LLM_PROVIDER: mock
      UV_PYTHON: ${{ matrix.python }}
      M15_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
      - name: Install ffmpeg and GStreamer (M2 frame grab, M8/M9 media, M14 tools and pipeline validator)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - run: uv sync --locked
      - name: Playwright Chromium (M15 sandbox agents and Ex 15.4)
        run: uv run playwright install --with-deps chromium
      - name: Lint
        run: uv run ruff check ../examples/python ../exercises ../projects ../scripts src && uv run ruff format --check ../examples/python ../exercises ../projects ../scripts src
      - name: Type-check
        run: bash ../scripts/typecheck_python.sh
      - name: Worked examples (mock models)
        run: uv run pytest -q -rs ../examples/python
      - name: Exercises and projects (solutions pass, starters fail)
        run: uv run python ../scripts/check_exercises.py --lang py
      - name: Quizzes (schema + answer keys)
        run: uv run python ../scripts/validate_quizzes.py

  typescript:
    name: TypeScript (examples, exercises)
    runs-on: ubuntu-latest
    env:
      COURSE_LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install ffmpeg (M14 highlight-reel test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Exercises and projects (solutions pass, starters fail)
        run: python3 scripts/check_exercises.py --lang ts

  kmp:
    name: Kotlin Multiplatform (JVM target)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test commonMain on the JVM (shared + P6 agent; fakes only, no device)
        run: ./gradlew :shared:jvmTest :p6-agent:jvmTest --console=plain
      - name: Test report (solution)
        if: always()
        run: python3 ../scripts/junit_summary.py shared/build/test-results/jvmTest ../projects/p6/agent/build/test-results/jvmTest
      - name: P6 starter must fail its tests
        # Runs after the report: it overwrites P6's jvmTest results with the starter's.
        run: |
          if ./gradlew :p6-agent:jvmTest -Pp6.variant=starter --console=plain -q > starter.log 2>&1; then
            echo "P6 starter passed its tests (exercise is stale)"; exit 1
          fi
          grep -E "tests completed" starter.log || true

  android:
    name: Android (SDK, KMP Android target, P6 app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Android SDK licence accepted with the owner's approval (14 Nov 2026). The runner image ships
      # an SDK; pin the platform and build tools this build uses.
      - name: Install pinned SDK packages and accept licences
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" > /dev/null
          "$SDKM" --list_installed | grep -E "platforms;android-37.0|build-tools;36.0.0"
      - name: assembleDebug, unit/host tests, instrumentation APK (compiled only, not run on a device)
        run: >
          ./gradlew --console=plain
          :shared:testAndroidHostTest :p6-agent:testAndroidHostTest
          :p6-app:assembleDebug :p6-app:testDebugUnitTest :p6-app:assembleDebugAndroidTest
      - name: Test report
        if: always()
        run: >
          python3 ../scripts/junit_summary.py shared/build/test-results/testAndroidHostTest
          ../projects/p6/agent/build/test-results/testAndroidHostTest
          ../projects/p6/app/build/test-results/testDebugUnitTest
      - name: APK sizes
        run: ls -l ../projects/p6/app/build/outputs/apk/debug/*.apk ../projects/p6/app/build/outputs/apk/androidTest/debug/*.apk

  rust:
    name: Rust (rmcp media-probe) + cross-language MCP contract
    runs-on: ubuntu-latest
    env:
      COURSE_LLM_PROVIDER: mock
      MEDIA_PROBE_RUST_BIN: ${{ github.workspace }}/rust/media-probe/target/debug/media-probe
      MEDIA_PROBE_REQUIRE_ALL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - name: Install ffmpeg and GStreamer (P3 pipeline tools)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: fmt, clippy, test
        working-directory: rust/media-probe
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --locked
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Python client vs Python, TypeScript and Rust servers (both revisions, real ffmpeg)
        working-directory: python
        run: uv sync --locked && uv run pytest -q -rs ../examples/python/m9
      - name: TypeScript client vs Rust server
        run: pnpm vitest run examples/ts/m9
      - name: P3 media toolkit (Python, TypeScript and Rust servers, agent client; skips become failures)
        working-directory: python
        env:
          P3_REQUIRE_ALL: "1"
          PROJECT_VARIANT: solution
        run: uv run pytest -q -rs ../projects/p3/evals
      - name: P5 capstone bench (Python, TypeScript and Rust team repo; skips become failures)
        working-directory: python
        env:
          P5_REQUIRE_ALL: "1"
          PROJECT_VARIANT: solution
        run: uv run pytest -q -rs ../projects/p5/evals
      - name: M10 agent-friendly Rust benchmark (real cargo builds; skips become failures)
        working-directory: python
        env:
          M10_REQUIRE_CARGO: "1"
        run: uv run pytest -q -rs ../examples/python/m10 -k "bench or audit"

  speckit:
    name: Spec Kit v1.4.0 template check (M10)
    runs-on: ubuntu-latest
    env:
      COURSE_LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
      - name: specify init (from the tagged GitHub release; no agent CLI needed)
        run: uvx --from git+https://github.com/github/spec-kit.git@v1.4.0 specify init /tmp/sk --integration claude --script sh --ignore-agent-tools --non-interactive
      - name: Course spec parser vs the real template (skips become failures)
        working-directory: python
        env:
          SPECKIT_DIR: /tmp/sk
          SPECKIT_REQUIRE: "1"
        run: uv sync --locked && uv run pytest -q -rs ../examples/python/m10

  llamacpp:
    name: llama.cpp v1.0.0 quantization (M13, real binaries, x86 CPU)
    runs-on: ubuntu-latest
    env:
      COURSE_LLM_PROVIDER: mock
      M13_REQUIRE_LLAMA: "1"
      LLAMA_CPP_DIR: /tmp/llama/llama-b12359
      LLAMA_MODEL: /tmp/llama/stories15M.gguf
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
      - name: Download llama.cpp b12359 (the v1.0.0 build) and stories15M
        run: |
          mkdir -p /tmp/llama && cd /tmp/llama
          curl -fsSL -o llama.tgz https://github.com/ggml-org/llama.cpp/releases/download/b12359/llama-b12359-bin-ubuntu-x64.tar.gz
          tar xzf llama.tgz && ls
          curl -fsSL -o stories15M.gguf https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories15M.gguf
      - name: Quantize, perplexity, KL divergence, bench (skips become failures)
        working-directory: python
        run: uv sync --locked && uv run pytest -q -rs ../examples/python/m13 -k llama
      - name: Print the measured table (runner CPU; numbers vary by machine)
        working-directory: examples/python
        run: uv run --project ../../python python -m m13.llama_quant

  site:
    name: Site build + internal link validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
