name: External link check

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links in the syllabus, lessons, exercises and examples
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 30 --max-retries 2
            --accept 200..=299,429
            --exclude-path site/node_modules --exclude-path node_modules
            './*.md' './site/src/content/docs/**/*.mdx' './exercises/**/*.md'
            './examples/**/*.py' './examples/**/*.ts' './python/src/**/*.py'
          fail: true
