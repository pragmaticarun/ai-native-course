[package]
name = "media-probe"
version = "0.1.0"
edition = "2024"
description = "M9 worked example: ffprobe/loudness tools as an MCP server with rmcp"
license = "MIT"
publish = false

[dependencies]
rmcp = { version = "=3.10.0", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process"] }
anyhow = "1"

[dev-dependencies]
rmcp = { version = "=3.10.0", features = ["client"] }
tokio = { version = "1", features = ["io-util"] }
tempfile = "3"
