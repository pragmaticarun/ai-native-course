# Pinned per SYLLABUS.md v0.3 section 2.4. Android entries added with the androidMain target
# (P6, Android SDK approved by the owner on 14 Nov 2026). activity/lifecycle/test pins: latest
# stable on Google Maven, checked 14 Nov 2026.
[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.13.0"
mcpKotlin = "0.16.0"
agp = "9.5.1"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
koog = "1.3.0"
koogLitert = "1.3.0-beta"      # preview: Koog's LiteRT executor is still beta
litertlm = "0.19.1"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
compileSdk = "37"
minSdk = "29"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
mcp-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcpKotlin" }
mcp-testing = { module = "io.modelcontextprotocol:kotlin-sdk-testing", version.ref = "mcpKotlin" }
mcp-client = { module = "io.modelcontextprotocol:kotlin-sdk-client", version.ref = "mcpKotlin" }

koog-agents = { module = "ai.koog:koog-agents", version.ref = "koog" }
koog-test = { module = "ai.koog:agents-test", version.ref = "koog" }
koog-litert = { module = "ai.koog:prompt-executor-litert-client", version.ref = "koogLitert" }
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
