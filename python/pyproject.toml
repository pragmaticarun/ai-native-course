[project]
name = "aincourse"
version = "0.1.0"
description = "Shared helpers and runnable examples for the AI-native software development course"
requires-python = ">=3.13"
# Pinned per SYLLABUS.md v0.3 section 2.4. Only what M0-M15 need is installed for now;
# later modules add their dependencies when their lessons land.
dependencies = [
  "inspect-ai==0.3.289",
  "langgraph==1.2.21",
  "mcp==2.3.0",
  "onnx==1.23.2",
  "onnxruntime==1.32.0",
  "playwright==1.65.1",
  "opentelemetry-sdk==1.45.2",
  "pydantic==2.14.3",
  "pydantic-ai-slim==2.68.0",
  "pyyaml==6.0.3",
  "temporalio==1.36.0",
]

[project.optional-dependencies]
# --live mode only. Not needed for the mock-first examples or CI.
live = ["openai==3.50.0", "anthropic==2.8.0"]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "ruff==0.17.5",
  "mypy==2.4.1",
  "jsonschema==4.26.0",
  "types-pyyaml==6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aincourse"]

[tool.mypy]
python_version = "3.13"
strict = false
check_untyped_defs = true
ignore_missing_imports = true
