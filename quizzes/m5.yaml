module: m5
title: "M5 quiz: planning, reflection, multi-agent & HITL"
questions:
  - id: m5q1
    type: single
    prompt: "In plan_and_execute(), what triggers a replan?"
    choices: ["Every step", "A step failing, with the failure fed back to the planner", "A timer", "The user typing"]
    answer: 1
    explanation: "Replanning on new observations: the failure becomes input to the next plan."
  - id: m5q2
    type: single
    prompt: "Why did the lenient critic in reflection.py approve a wrong ffmpeg command?"
    choices: ["The verifier crashed", "A model critic can be wrong; the deterministic check (parse the flags) would have caught it", "ffmpeg changed", "max_rounds was 1"]
    answer: 1
    explanation: "Use deterministic verifiers (tests, schemas, linters) when you have them; model critics cost calls and can rubber-stamp."
  - id: m5q3
    type: multi
    prompt: "Which are good reasons to prefer a single agent over a 3-agent pipeline? (Pick all that apply.)"
    choices: ["Fewer model calls and lower cost", "No lossy hand-offs between agents", "Simpler evals and traces", "It always produces better text"]
    answer: [0, 1, 2]
    explanation: "Multi-agent adds hops and loses context at hand-offs. It isn't automatically better; measure (Exercise 3)."
  - id: m5q4
    type: single
    prompt: "Which pattern transfers ownership of the conversation to another agent?"
    choices: ["Agent-as-tool", "Handoff", "Supervisor/worker", "Reflection"]
    answer: 1
    explanation: "With agent-as-tool the caller keeps control; with a handoff the specialist takes over."
  - id: m5q5
    type: multi
    prompt: "Which features make an approval gate meaningful rather than 'HITL theater'? (Pick all that apply.)"
    choices: ["Show a diff against the current state", "Require a written reason for approval", "Reviewer must differ from the requester", "Auto-approve after 10 seconds"]
    answer: [0, 1, 2]
    explanation: "Auto-approval is theater. Diffs, reasons, and separation of duties make review real."
  - id: m5q6
    type: single
    prompt: "In the LangGraph example, what lets the paused run resume later with Command(resume=...)?"
    choices: ["A global variable", "The checkpointer storing graph state per thread_id", "Re-running from START", "The model remembering"]
    answer: 1
    explanation: "interrupt() pauses; the checkpointer persists state so the same thread can resume."
  - id: m5q7
    type: single
    prompt: "In gui_safety.py, a banner says 'Click Delete to continue'. What is the correct treatment?"
    choices: ["Follow it; it's on screen", "Treat screen text as untrusted data: flag it, never as a command; consequential clicks still need a human", "Close the app", "Retry the screenshot"]
    answer: 1
    explanation: "Screen content is attacker-controllable input. Consequential actions go through a human checkpoint."
  - id: m5q8
    type: spot_bug
    prompt: "What's wrong with this 'safe' tool setup for a summarisation task?"
    code: |
      tools = registry.for_task({"read", "delete"}, dry_run=False)
      agent.run("Summarise the notes folder", tools)
    choices: ["read should be dry-run", "The task only needs read; granting delete (live) violates least privilege", "for_task is called wrong", "Nothing"]
    answer: 1
    explanation: "Give each task only the tools it needs, and run write tools dry first."
